# Herdr configuration tuned to feel like settings/dot_tmux.conf and the zellij config.
# Upstream reference: https://herdr.dev/docs/configuration/ and /docs/config-reference/
#
# Model note: Herdr is an agent orchestrator, not a plain multiplexer. Its nesting is
# session -> workspace (per project) -> tab -> pane, and agents (claude/codex/pi) are
# first-class, state-tracked entities in the sidebar. Sessions persist server-side, so
# there is no bool/zbool-style rebuild step -- make a workspace once and it survives
# detach/restart. Herdr is also mouse-native; the keyboard layer below is optional.

# Skip the first-run onboarding flow.
onboarding = false

[keys]
# tmux `set -g prefix ``  -- backtick prefix for muscle memory.
# CAVEAT: unlike tmux there is no documented double-tap-to-send-literal, so emitting a
# literal ` into a pane may be awkward. If that gets annoying, switch to "ctrl+b".
prefix = "backtick"

# Leader j/k tab navigation (the tl;dr of this file's customization).
# `prefix+k` = next tab, `prefix+j` = previous tab, mirroring editor tab
# switching (e.g. j/k in telescope / file managers under the leader).
previous_tab = "prefix+j"
next_tab = "prefix+k"

# Leader n/p workspace navigation (tmux-style: `prefix+n`/`prefix+p` move across
# windows). Herdr calls these "workspaces" (per-project spaces). Unset by
# default, so these are explicit overrides. `prefix+N` still creates a workspace
# (new_workspace below), matching tmux's create-window on the uppercase variant.
previous_workspace = "prefix+p"
next_workspace = "prefix+n"

# Pane navigation on raw Ctrl+hjkl (vim-tmux-navigator muscle memory), instead of
# the prefix+h/l defaults. These are written as raw chords, not prefix-bound.
# NOTE: in most terminal multiplexers ctrl+h / ctrl+j collide with backspace /
# enter; herdr redefines them here, but if a pane app never sees a keystroke,
# that is why. Esc below is the escape hatch.
focus_pane_left  = "ctrl+h"
focus_pane_down  = "ctrl+j"
focus_pane_up    = "ctrl+k"
focus_pane_right = "ctrl+l"

# Split keys follow the symbol shapes: `|` is a side-by-side split (Herdr
# "vertical"), `-` is a stacked split (Herdr "horizontal") — tmux-style, where
# `|`/`H` = side-by-side and `-` = stacked.
split_vertical = "prefix+|"
split_horizontal = ["prefix+minus", "prefix+backslash"]

# Everything else already matches your tmux/zellij bindings via Herdr defaults:
#   focus panes    ctrl+h/j/k/l        (vim-tmux-navigator-style raw chords; no
#                                        prefix, no separate direction mode)
#   close pane     prefix+x            (tmux `x`)
#   close tab      prefix+shift+x      (tmux `X`)
#   new tab        prefix+c            (zellij `c`)
#   new workspace  prefix+shift+n      (herdr default; documented below as new_workspace)
#   rename workspace prefix+shift+w    (herdr default)
#   next/prev tab  prefix+k / prefix+j (leader j/k; overrides the tmux `n`/`p`
#                                        defaults per user preference)
#   zoom           prefix+z            (zellij `z`)
#   copy mode      prefix+[            (tmux/zellij `[`)
#   goto tab 1-9   prefix+1..9         (zellij number jumps)
#   rename tab     prefix+shift+t      (tmux used `R`; kept default to avoid the
#                                        reload_config = prefix+shift+r collision)
#   detach         prefix+q            (tmux/zellij `d`)
#   workspace nav  prefix+n / prefix+p (override of the tmux-cycle defaults; j/k
#                                        for tabs, n/p for workspaces)
#   workspace picker prefix+w           (replaces the fzf F/P popups; mouse sidebar too)
#   session goto   prefix+g            (fuzzy jump across workspaces/tabs/panes)

# Explicit binding for creating a new workspace (a project "space"). This is the
# herdr default and already active; listed here so it's discoverable in this file.
# New workspace = prefix+`shift`+n  -> `then N. (Ctrl for compare: new tab = prefix+c.)
new_workspace = "prefix+shift+n"

[terminal]
# tmux `set -g default-shell /bin/zsh`.
default_shell = "/bin/zsh"
# Start login shells on macOS so Homebrew / path_helper PATH setup runs in new panes.
shell_mode = "auto"

[theme]
# Closest match to the zellij catppuccin-macchiato theme (and the tmux dracula vibe).
name = "catppuccin"

[ui]
# tmux `set-option -g status-position top`.
tab_bar_position = "top"
# zellij copy_on_select / copy_on_select true (also the Herdr default).
copy_on_select = true
show_agent_labels_on_pane_borders = true
